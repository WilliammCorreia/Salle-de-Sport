<div class="container py-5">
  <div class="row justify-content-center">
    <div class="col-md-6">
      <div class="card">
        <div class="card-body">
          <h2 class="card-title text-center mb-4">Inscription</h2>
          
          <form (ngSubmit)="onSubmit()">
            <div class="row mb-3">
              <div class="col-md-6">
                <label class="form-label">Prénom:</label>
                <input type="text" class="form-control" [(ngModel)]="formData.firstName" name="firstName" required>
              </div>
              
              <div class="col-md-6">
                <label class="form-label">Nom:</label>
                <input type="text" class="form-control" [(ngModel)]="formData.lastName" name="lastName" required>
              </div>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Email:</label>
              <input type="email" class="form-control" [(ngModel)]="formData.email" name="email" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Mot de passe:</label>
              <input type="password" class="form-control" [(ngModel)]="formData.password" name="password" required>
            </div>
            
            <div class="mb-3">
              <label class="form-label">Téléphone:</label>
              <input type="tel" class="form-control" [(ngModel)]="formData.phone" name="phone">
            </div>
            
            <div class="mb-4">
              <label class="form-label">Rôle:</label>
              <select class="form-select" [(ngModel)]="formData.role" name="role">
                <option value="client">Client</option>
                <option value="gym_owner">Propriétaire de salle</option>
                <option value="super_admin">Super Admin</option>
              </select>
            </div>
            
            @if (errorMessage) {
              <div class="alert alert-danger">{{ errorMessage }}</div>
            }
            
            <button type="submit" class="btn btn-primary w-100" [disabled]="loading">
              {{ loading ? 'Inscription...' : 'S\'inscrire' }}
            </button>
          </form>
          
          <div class="text-center mt-3">
            <a routerLink="/login" href="/login" class="text-decoration-none">Déjà un compte ? Se connecter</a>
          </div>
        </div>
      </div>
    </div>
  </div>
</div>
